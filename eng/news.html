        <script>// Additionnal code for the slider
            var pos = 0,
                slides = $('.slide'),
                numOfSlides = slides.length;
            
            function nextSlide(){
                stopCurrentVideo();
                slides.eq(pos).animate({left:'-100%'},500);
                pos = pos >= numOfSlides-1 ? 0 : ++pos;
                slides.eq(pos).css({left:'100%'}).animate({left:0},500);
            }
            
            function previousSlide(){
                stopCurrentVideo();
                slides.eq(pos).animate({left:'100%'},500);
                pos = pos == 0 ? numOfSlides-1 : --pos;
                slides.eq(pos).css({left:'-100%'}).animate({left:0},500);
            }
            
            function stopCurrentVideo(){
                $('.slider-video:eq('+pos+')').load().removeAttr('controls')
                .siblings('.overlay-content').show().find('.play-button').show();
            }
            
            $('.left').click(previousSlide);
            $('.right').click(nextSlide);
        </script>
        
        <script>
            var feedUrl = "https://www.youtube.com/feeds/videos.xml?channel_id=UCGiIc0aaP6o8v11-M4j3q8g";
            var videoIframes = document.getElementsByClassName('latestVideoEmbed');
            fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feedUrl.replace("https://", "http://")))
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    if (!data.items) return;
                    for (var i = 0; i < videoIframes.length; i++) {
                        var video = data.items[Number(videoIframes[i].getAttribute('data-video-number'))];
                        if (video && video.link) {
                            videoIframes[i].src = "https://www.youtube.com/embed/" + video.link.split("v=")[1];
                        }
                    }
                });
        </script>
